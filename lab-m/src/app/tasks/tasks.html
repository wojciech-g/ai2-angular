<div class="container">
  <form class="new-task">
    <mat-form-field>
      <mat-label>Title</mat-label>
      <input matInput type="text" name="title" [(ngModel)]="newTask.title" />
      <mat-hint>Enter at least 1 character.</mat-hint>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Deadline</mat-label>
      <input matInput name="deadline" [matDatepicker]="picker" [(ngModel)]="newTask.deadline" />
      <mat-hint>Specifying date is optional.</mat-hint>
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <button matButton="tonal" type="button" (click)="addTask()" [disabled]="!canAddTask()">Add Task</button>
  </form>

  <div class="tasks">
    @for (task of tasks; track task.id) {
      <mat-card [class.completed]="task.completed">
        <mat-card-header>
          @if (task.deadline) {
            <mat-card-subtitle>{{ task.deadline | date: 'yyyy-MM-dd' }}</mat-card-subtitle>
          }
          <mat-card-title>{{ task.title }}</mat-card-title>
        </mat-card-header>
        <mat-card-actions align="end">
          <mat-checkbox [(ngModel)]="task.completed" (change)="handleChange(task)">Done</mat-checkbox>
        </mat-card-actions>
      </mat-card>
    }
  </div>
  <button matButton="outlined" class="archive" type="button" (click)="archiveCompleted()" [disabled]="!canArchiveCompleted()">Archive Completed</button>
</div>
