<div class="container">
  <form class="new-task">
    <label for="title">Title</label>
    <input type="text" id="title" name="title" [(ngModel)]="newTask.title" />

    <label for="deadline">Deadline</label>
    <input type="date" id="deadline" name="deadline" [(ngModel)]="newTask.deadline" />

    <button type="button" (click)="addTask()">Add Task</button>
  </form>

  <div class="tasks">
    @for (task of tasks; track task.id) {
      <div class="task" [class.completed]="task.completed">
        <div class="title">{{ task.title }}</div>
        <div class="deadline">
          @if (task.deadline) {
            <span>{{ task.deadline }}</span>
          }
        </div>
        <div class="actions">
          <input type="checkbox" [(ngModel)]="task.completed" (change)="handleChange(task)" />
        </div>
      </div>
    }
  </div>
  <button class="archive" type="button" (click)="archiveCompleted()">Archive Completed</button>
</div>
